function openEditReport(id){
  if(!isAcctManager()){ alert("회계 담당자만 할 수 있어요."); return; }
  const r=acctReports.find(x=>x.id===id);
  if(!r)return;
  const groupRows=(items,kindKo)=>{
    const map={};
    (LEDGER_CATS[kindKo]||[]).forEach(c=>map[c]=[]);
    items.forEach((row,i)=>{ const c=row.category||"기타"; if(!map[c])map[c]=[]; map[c].push({row,i}); });
    return map;
  };
  const safeId=s=>String(s).replace(/[^a-zA-Z0-9]/g,"_");
  const groupBlock=(groups,kind,kindKo)=>{
    let out="";
    Object.keys(groups).forEach(cat=>{
      const gid=`er-${kind}-${safeId(cat)}`;
      out+=`<div style="font-size:12px;font-weight:700;color:var(--ink-soft);margin:12px 0 6px 2px">${esc(cat)}</div>
        <div id="${gid}">${groups[cat].map(({row,i})=>editRowHtml(kind,i,row)).join("")}</div>
        <button class="btn ghost sm" onclick="document.getElementById('${gid}').insertAdjacentHTML('beforeend',editRowHtml('${kind}',Date.now(),{category:'${esc(cat).replace(/'/g,"&#39;")}'}))">＋ ${esc(cat)}에 항목 추가</button>`;
    });
    return out;
  };
  const incGroups=groupRows(r.incomes,"수입");
  const expGroups=groupRows(r.expenses,"지출");
  let h=`<div class="grab"></div><h3>보고서 수정 — ${esc(r.title)}</h3>
    <div class="note" style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px">필요할 때 언제든 고칠 수 있어요. 저장하면 이 보고서만 바뀌고 다른 보고서는 그대로예요.</div>
    <div class="field"><label>제목</label><input id="er-title" value="${esc(r.title)}"></div>
    <div class="field"><label>이월금</label><input id="er-carry" type="text" inputmode="numeric" value="${formatWon(r.summary.carry)}" oninput="this.value=formatWon(this.value)"></div>
    <div style="font-weight:800;margin:14px 0 8px">② 세부 수입 내역</div>
    <div id="er-incomes">${groupBlock(incGroups,"income","수입")}</div>
    <div style="font-weight:800;margin:14px 0 8px">③ 세부 지출 내역</div>
    <div id="er-expenses">${groupBlock(expGroups,"expense","지출")}</div>
    <div style="font-weight:800;margin:14px 0 8px">④ 선물 · 나눔 · 공유</div>
    <div id="er-gifts">${r.gifts.map((row,i)=>editRowHtml("gift",i,row)).join("")}</div>
    <button class="btn ghost sm" onclick="document.getElementById('er-gifts').insertAdjacentHTML('beforeend',editRowHtml('gift',Date.now(),{}))">＋ 선물 항목 추가</button>
    <div class="modal-actions">
      <button class="btn ghost" onclick="if(confirm('이 보고서를 완전히 삭제할까요?')){delAcctReport('${r.id}');}">보고서 삭제</button>
      <button class="btn lilac" onclick="saveEditReport('${r.id}')">저장</button>
    </div>`;
  showModal(h);
}
function collectRows(containerId){
  return Array.from(document.querySelectorAll(`#${containerId} [data-editrow]`)).map(box=>{
    const obj={};
    box.querySelectorAll("[data-f]").forEach(inp=>{
      const f=inp.dataset.f;
      obj[f]= f==="amount" ? parseWon(inp.value) : inp.value.trim();
    });
    return obj;
  });
}
function saveEditReport(id){
  if(!isAcctManager()){ alert("회계 담당자만 할 수 있어요."); return; }
  const r=acctReports.find(x=>x.id===id);
  if(!r)return;
  r.title=val("er-title").trim()||r.title;
  r.summary.carry=parseWon(val("er-carry"));
  r.incomes=collectRows("er-incomes");
  r.expenses=collectRows("er-expenses");
  r.gifts=collectRows("er-gifts");
  r.summary.income=r.incomes.reduce((s,i)=>s+(Number(i.amount)||0),0);
  r.summary.expense=r.expenses.reduce((s,i)=>s+(Number(i.amount)||0),0);
  r.summary.balance=r.summary.carry+r.summary.income-r.summary.expense;
  markPending(r);syncUpsert("acctReports",r);
  closeModal();renderAcctHub();openAcctReport(r.id);
  toast("보고서를 수정했어요");
}
function delAcctReport(id){
  if(!isAcctManager()){ alert("회계 담당자만 할 수 있어요."); return; }
  acctReports=acctReports.filter(r=>r.id!==id);
  syncDelete("acctReports",id);
  closeModal();openAcctHub("report");
  toast("보고서를 삭제했어요");
}

    if(held.length){
      h+=`<div style="font-size:12px;color:var(--ink-soft);font-weight:700;margin:18px 2px 8px">승인 보류 중 · ${held.length}</div>`;

function vreqCard(r,state){
  const nights=Math.max(0,Math.round((new Date(r.end)-new Date(r.start))/864e5));
  const badge = state==="waiting"
    ? `<span style="flex-shrink:0;white-space:nowrap;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:9px;background:rgba(208,139,99,.16);color:#A85E38">승인 대기</span>`
    : state==="approved"
      ? `<span style="flex-shrink:0;white-space:nowrap;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:9px;background:rgba(142,176,78,.14);color:var(--moss-deep)">승인됨</span>`
      : `<span style="flex-shrink:0;white-space:nowrap;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:9px;background:rgba(201,182,220,.2);color:var(--lilac-deep)">승인 보류</span>`;
  const resubmitTag = (state==="waiting" && r.resubmitted) ? `<span style="flex-shrink:0;white-space:nowrap;font-size:11px;font-weight:700;padding:4px 10px;border-radius:9px;background:rgba(95,169,214,.16);color:#3F7CA0">재신청</span>` : "";
  const titleLine=`${esc(r.name||"이름없음")} <span style="font-size:12.5px;color:var(--ink-soft);font-weight:400">· ${r.people||1}명${r.companions?" · "+esc(r.companions):""}</span>`;
  const holdReasonLine = (state==="held" && r.holdReason) ? `<div style="margin-top:8px;background:rgba(201,182,220,.14);border-radius:9px;padding:8px 11px;font-size:13px;line-height:1.55;color:var(--lilac-deep);min-width:0;overflow-wrap:anywhere">${mdRender(r.holdReason)}</div>` : "";
  let h=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <b style="font-size:16px;flex:1;min-width:0">${titleLine}</b>
      <div style="display:flex;gap:6px;flex-shrink:0">${resubmitTag}${badge}</div>
    </div>
    ${holdReasonLine}
    <div style="font-size:15.5px;font-weight:700;color:var(--sky);margin-top:9px">${fmtDate(r.start)} — ${fmtDate(r.end)} <span style="font-size:12.5px;color:var(--ink-soft);font-weight:400">(${nights}박)</span></div>
    <div style="margin-top:10px;font-size:13.5px;line-height:1.7">
      ${r.phone?`<div><span style="color:var(--ink-soft)">연락처</span> · <a href="tel:${esc(r.phone.replace(/[^0-9]/g,""))}" style="color:var(--sky)">${esc(r.phone)}</a></div>`:""}
      ${r.question?`<div><span style="color:var(--ink-soft)">문의</span> · ${esc(r.question)}</div>`:""}
    </div>`;
  if(r.messages&&r.messages.length){
    h+=`<div style="margin-top:10px;background:var(--paper-2);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:7px;overflow:hidden">
      <div style="font-size:10.5px;color:var(--ink-soft);font-weight:700">주고받은 메시지</div>
      ${r.messages.map(m=>`<div style="font-size:13px;line-height:1.6;min-width:0;overflow-wrap:anywhere;word-break:break-word">
        <span style="color:var(--ink-soft);font-size:11px">${fmtWhen(m.at)}${m.read?` · <span style="color:var(--moss-deep)">방문자가 확인함</span>`:""}</span><br>${mdRender(m.text)}</div>`).join("")}
    </div>`;
  }
  if(state==="waiting" && reqOverlaps(r)){
    h+=`<div style="margin-top:10px;background:rgba(208,139,99,.14);color:#A85E38;border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.6">⚠ 이 기간이 이미 확정된 일정과 겹쳐요. 승인 전에 일정 탭을 확인해주세요.</div>`;
  }
  if(state==="waiting"||state==="held"){
    h+=`<div class="modal-actions" style="margin-top:12px">
      <button class="btn ghost" onclick="askHold('${r.id}')">${state==="held"?"보류 사유 다시 쓰기":"승인보류"}</button>
      <button class="btn" onclick="decideVisitReq('${r.id}','승인')">승인하고 일정에 넣기</button>
    </div>`;
  }
  h+=`<div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn ghost sm" style="flex:1" onclick="askMessage('${r.id}')">✎ 메시지 보내기</button>
    <button class="btn ghost sm" onclick="deleteVisitReq('${r.id}')" style="color:#A85E38">삭제</button>
  </div>`;
  h+=`</div>`;
  return h;
}
function askHold(id){
  showModal(`<div class="grab"></div><h3>승인보류 사유</h3>
    <div style="font-size:13.5px;color:var(--ink-soft);margin-bottom:10px;line-height:1.6">방문자의 "내 방문" 화면에 그대로 전달돼요. 다른 날짜를 제안하거나, 보류 이유를 적어주세요.</div>
    <div class="field"><textarea id="hold-reason" placeholder="예) 그 기간엔 이미 다른 팀이 머물러요. 8월 마지막 주는 어떠세요?"></textarea></div>
    <div class="modal-actions" style="margin-top:14px">
      <button class="btn ghost" onclick="closeModal()">취소</button>
      <button class="btn" onclick="confirmHold('${id}')">보류로 전달</button>
    </div>`);
  setTimeout(()=>{ const el=document.getElementById("hold-reason"); if(el) el.focus(); },50);
}
async function confirmHold(id){
  const el=document.getElementById("hold-reason");
  const reason=(el&&el.value||"").trim();
  if(!reason){ toast("보류 사유를 적어주세요"); return; }
  closeModal();
  await decideVisitReq(id,"보류",reason);
}
function askMessage(id){
  showModal(`<div class="grab"></div><h3>메시지 보내기</h3>
    <div style="font-size:13.5px;color:var(--ink-soft);margin-bottom:10px;line-height:1.6">이 방문자의 "내 방문" 화면에 바로 전달돼요.</div>
    <div class="field"><textarea id="msg-text" placeholder="예) 머리끈 챙겨오세요 / 에어컨은 이렇게 써주세요"></textarea></div>
    <div class="modal-actions" style="margin-top:14px">
      <button class="btn ghost" onclick="closeModal()">취소</button>
      <button class="btn" onclick="sendMessage('${id}')">보내기</button>
    </div>`);
  setTimeout(()=>{ const el=document.getElementById("msg-text"); if(el) el.focus(); },50);
}
async function sendMessage(id){
  const el=document.getElementById("msg-text");
  const text=(el&&el.value||"").trim();
  if(!text){ toast("내용을 적어주세요"); return; }
  const req=visitRequests.find(r=>r.id===id); if(!req) return;
  req.messages=req.messages||[];
  req.messages.push({text, at:Date.now(), by:me||"집사"});
  req.updatedAt=Date.now();
  markPending(req);
  closeModal();
  renderVisitReq();
  await syncUpsert("visitRequests",req);
}
function reqOverlaps(req){
  return (visits||[]).some(v=>{
    if(v.id==="v_from_"+req.id) return false;
    return req.start<=v.end && v.start<=req.end; // 퇴실일도 막혀 있는 폐구간 기준 겹침 판정
  });
}
function upsertLocalVisit(item){
  item.__pending=Date.now();
  const idx=visits.findIndex(v=>v.id===item.id);
  if(idx>=0) visits[idx]=item; else visits.push(item);
}
function removeLocalVisit(id){ visits=visits.filter(v=>v.id!==id); }

async function deleteVisitReq(id){
  const req=visitRequests.find(r=>r.id===id);
  if(!confirm(`${req&&req.name||"이"} 신청을 완전히 삭제할까요? (되돌릴 수 없어요)`)) return;
  visitRequests=visitRequests.filter(r=>r.id!==id);
  const hadVisit=visits.some(v=>v.id==="v_from_"+id);
  removeLocalVisit("v_from_"+id);
  renderVisitReq();renderHome();renderVisits();
  await syncDelete("visitRequests",id);
  if(hadVisit) await syncDelete("visits","v_from_"+id);
  toast("삭제했어요");
}
async function decideVisitReq(id,status,reason){
  const req=visitRequests.find(r=>r.id===id); if(!req) return;
  if(status==="승인" && reqOverlaps(req)){
    if(!confirm("이 기간이 다른 일정과 겹쳐요. 그래도 승인할까요?")) return;
  }else if(!reason){
    if(!confirm(`${req.name||""}님 방문을 ${status} 처리할까요?`)) return;
  }
  const prevStatus=req.status;
  req.status=status; req.decidedBy=me||""; req.updatedAt=Date.now();
  if(reason){
    req.holdReason=reason; // 보류 사유는 개인 메시지와 분리해 상태 배지 옆에 바로 보여줌
  }
  markPending(req);
  if(status==="승인"){
    upsertLocalVisit({id:"v_from_"+req.id, who:req.name||"손님", guest:req.companions||"", start:req.start, end:req.end,
      note:((req.people||1)+"명")+(req.question?" · 문의있음":""), color:"#8FB04E", updatedAt:Date.now()});
  }else if(prevStatus==="승인"){
    removeLocalVisit("v_from_"+req.id); // 승인 취소/보류되면 달력에서도 즉시 내려감
  }
  renderVisitReq();renderHome();renderVisits();
  await syncUpsert("visitRequests",req);
  setTimeout(()=>syncPullAll(true),1500);
}

/* ============================================================
   화면 — 방문자 후기
   ============================================================ */
let reviewsShown=10;
function renderReviews(){
  const v=document.getElementById("view-reviews");
  const list=[...reviews].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  let h=`<div class="view-head"><div><div class="t">방문자 후기</div>
    <div class="d">머물다 간 분들이 남긴 이야기입니다</div></div>
    <button class="btn ghost sm" onclick="syncPullAll()">↻ 새로고침</button></div>`;
  if(!list.length){
    h+=`<div class="empty"><div class="big">💬</div>아직 남겨진 후기가 없어요.<br>머문 분들이 후기를 남기면 여기 모입니다.</div>`;
  }else{
    let failed=0;
    list.slice(0,reviewsShown).forEach(r=>{
      try{ h+=reviewCard(r); }
      catch(e){ failed++; console.error("후기 표시 실패 · id=",r&&r.id,e); }
    });
    if(failed) h+=`<div style="text-align:center;font-size:12px;color:var(--ink-soft);padding:10px">표시하지 못한 후기 ${failed}건이 있어요 (개발자도구 콘솔 참고)</div>`;
    if(list.length>reviewsShown){
      h+=`<button class="btn ghost sm" style="width:100%;margin-top:4px" onclick="loadMoreReviews()">
        더 보기 (총 ${list.length}개 중 ${reviewsShown}개 보는 중)</button>`;
    }
  }
  v.innerHTML=h;
}
function loadMoreReviews(){ reviewsShown+=10; renderReviews(); }
function fmtWhen(ms){
  if(!ms) return "";
  const dt=new Date(ms);
  const hh=dt.getHours(), mi=dt.getMinutes();
  const ap=hh<12?"오전":"오후", h12=hh%12===0?12:hh%12;
  const hm=`${ap} ${h12}:${String(mi).padStart(2,"0")}`;
  const md=`${dt.getMonth()+1}.${dt.getDate()}`;
  const days=Math.floor((Date.now()-ms)/86400000);
  const rel = days<=0 ? "오늘" : days===1 ? "어제" : `${days}일 전`;
  return `${md} ${hm} · ${rel}`;
}
let expandedReviews=new Set(); // 펼친 후기 id 기억 — 25초 자동동기화로 다시 그려져도 안 접히게
function reviewCard(r){
  const hasVal=v=>v!==undefined&&v!==null&&v!=="";
  const stars=n=>{let s="";for(let i=1;i<=5;i++)s+=`<span style="color:${i<=(n||0)?"var(--sun)":"var(--line)"}">★</span>`;return s;};
  const row=(label,val)=>hasVal(val)?`<div style="background:var(--paper-2);border-radius:10px;padding:9px 12px"><div style="font-size:10px;color:var(--moss-deep);font-weight:700;margin-bottom:2px">${label}</div><div style="font-size:13px;line-height:1.6;color:var(--ink);white-space:pre-line">${esc(val)}</div></div>`:"";
  // 방문자 앱은 이 두 항목을 척도(0/1/2)로 보내고, 예전 설문 가져온 건 서술형 문장 그대로임 — 둘 다 자연스럽게 보여줌
  const scaleLabel=(v,opts)=>{
    if(v===0||v==="0") return opts[0];
    if(v===1||v==="1") return opts[1];
    if(v===2||v==="2") return opts[2];
    return v; // 이미 서술형 문장(옛 설문 데이터)이면 그대로
  };
  const guidehelpTxt=hasVal(r.guidehelp)?scaleLabel(r.guidehelp,["별로","보통","많이"]):"";
  const revisitTxt=hasVal(r.revisit)?scaleLabel(r.revisit,["글쎄요","아마도","꼭이요"]):"";
  const snippet=r.good||r.bestmoment||r.suggest||r.bad||(typeof r.guidehelp==="string"?r.guidehelp:"")||"";
  const fullFields=[
    ["머문 기간",r.period],["좋았던 점",r.good],["아쉬웠던 점",r.bad],["바라는 점",r.suggest],
    ["가장 편안했던 순간",r.bestmoment],["가장 불편했던 순간",r.worstmoment],
    ["안내서 도움",guidehelpTxt],["안내서 보완점",r.guidemore],
    ["하동 추천",r.hadong],["재방문 의향",revisitTxt],
  ].filter(([,v])=>hasVal(v));
  const isOpen=expandedReviews.has(r.id);
  let h=`<div class="card" id="rev-${r.id}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div>
        <span style="font-size:15px;letter-spacing:2px">${r.comfort?stars(r.comfort):`<span style="font-size:12px;color:var(--ink-soft)">편안함 응답 없음</span>`}</span>
        <div style="font-size:11px;color:var(--ink-soft);margin-top:4px">${r.period?esc(r.period)+" · ":""}${fmtWhen(r.updatedAt)}</div>
      </div>
      <button class="btn ghost sm" onclick="delReview('${r.id}')">삭제</button>
    </div>
    <div style="margin-top:10px;font-size:13.5px;line-height:1.6;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(snippet)||"새 후기가 도착했어요"}</div>
    ${fullFields.length?`<button class="rev-toggle" data-count="${fullFields.length}" onclick="toggleReview('${r.id}')" style="margin-top:9px;background:none;border:none;padding:0;font-size:12px;color:var(--sky);font-weight:700;display:flex;align-items:center;gap:3px">${isOpen?`접기 <i class="ti ti-chevron-up" style="font-size:14px"></i>`:`전체 답변 ${fullFields.length}개 더보기 <i class="ti ti-chevron-down" style="font-size:14px"></i>`}</button>`:""}
    <div class="rev-full" style="display:${isOpen?"block":"none"};margin-top:12px">
      <div style="height:1px;background:var(--line);margin-bottom:12px"></div>
      <div style="display:flex;flex-direction:column;gap:9px">
        ${fullFields.map(([l,v])=>row(l,v)).join("")}
        ${r.contact?`<div style="background:var(--paper-2);border-radius:10px;padding:9px 12px"><div style="font-size:10px;color:var(--moss-deep);font-weight:700;margin-bottom:2px">연락처</div><div style="font-size:13px;color:var(--ink)">${esc(r.contact)}</div></div>`:""}
      </div>
    </div>
  </div>`;
  return h;
}
function toggleReview(id){
  const card=document.getElementById("rev-"+id); if(!card) return;
  const full=card.querySelector(".rev-full"), btn=card.querySelector(".rev-toggle");
  const opening=full.style.display==="none";
  full.style.display=opening?"block":"none";
  if(opening) expandedReviews.add(id); else expandedReviews.delete(id);
  if(btn){
    btn.innerHTML = opening
      ? `접기 <i class="ti ti-chevron-up" style="font-size:14px"></i>`
      : `전체 답변 ${btn.dataset.count}개 더보기 <i class="ti ti-chevron-down" style="font-size:14px"></i>`;
  }
}
function delReview(id){
  if(!confirm("이 후기를 지울까요?"))return;
  reviews=reviews.filter(r=>r.id!==id);syncDelete("reviews",id);renderReviews();renderHome();
}

/* ============================================================
   공통 — 모달 · 탭 · 시작
   ============================================================ */
function val(id){return document.getElementById(id).value;}
function autoGrowTextarea(el){ el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"; }
function autoGrowAllIn(root){ root.querySelectorAll("textarea").forEach(autoGrowTextarea); }
document.addEventListener("input",e=>{ if(e.target.tagName==="TEXTAREA") autoGrowTextarea(e.target); });

/* ── 서식 있는 글(볼드·밑줄·취소선·색) ──
   textarea 안에서 윈도우 표준 단축키로 마킹 문법을 삽입하고,
   보여줄 때만 mdRender()로 실제 서식으로 바꿔서 표시합니다.
   Ctrl+B 볼드 · Ctrl+U 밑줄 · Ctrl+Shift+X 취소선 · Ctrl+Shift+1~4 색(흙빛·초록·하늘·보라) */
const MD_COLORS={1:"#A85E38",2:"#6E8C3A",3:"#3F7CA0",4:"#9B7FB8"};
function wrapSelection(el,before,after){
  const s=el.selectionStart, e=el.selectionEnd, v=el.value;
  const mid=v.slice(s,e)||"";
  el.value=v.slice(0,s)+before+mid+after+v.slice(e);
  const cs=s+before.length, ce=cs+mid.length;
  el.setSelectionRange(cs,ce);
  el.focus();
  autoGrowTextarea(el);
}
document.addEventListener("keydown",e=>{
  if(e.target.tagName!=="TEXTAREA") return;
  const ctrl=e.ctrlKey||e.metaKey;
  if(!ctrl) return;
  if(!e.shiftKey && e.key.toLowerCase()==="b"){ e.preventDefault(); wrapSelection(e.target,"**","**"); }
  else if(!e.shiftKey && e.key.toLowerCase()==="u"){ e.preventDefault(); wrapSelection(e.target,"__","__"); }
  else if(e.shiftKey && e.key.toLowerCase()==="x"){ e.preventDefault(); wrapSelection(e.target,"~~","~~"); }
  else if(e.shiftKey && MD_COLORS[e.key]){ e.preventDefault(); wrapSelection(e.target,"{{"+e.key+":","}}"); }
});
function mdRender(text){
  if(!text) return "";
  let s=esc(text); // 먼저 이스케이프해서 안전하게 만든 뒤에만 마킹 문법을 실제 태그로 바꿈
  Object.keys(MD_COLORS).forEach(k=>{
    s=s.replace(new RegExp("\\{\\{"+k+":([^}]*)\\}\\}","g"),`<span style="color:${MD_COLORS[k]}">$1</span>`);
  });
  s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  s=s.replace(/__([^_]+)__/g,"<u>$1</u>");
  s=s.replace(/~~([^~]+)~~/g,"<s>$1</s>");
  return s;
}

function showModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modalBg").classList.add("on");document.getElementById("modalBox").scrollTop=0;autoGrowAllIn(document.getElementById("modalBox"));}
function closeModal(){document.getElementById("modalBg").classList.remove("on");}
document.getElementById("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});

function renderAll(){
  renderHome();renderTimeline();renderMinutes();renderVisits();renderCare();renderTodo();renderNotes();renderVisitReq();renderReviews();renderAcctHub();
  // 검색 화면을 보고 있고 입력 중이 아니면 결과도 최신으로
  const sv=document.getElementById("view-search");
  if(sv && sv.classList.contains("on") && document.activeElement!==document.getElementById("srch-input")) renderSearchResults();
}

/* ── 집사 이름 (이 기기에 기억) ── */
const NAME_KEY="garyeobjip_me";
function loadMe(){
  try{me=localStorage.getItem(NAME_KEY)||"";}catch(e){me="";}
}
function setMe(name){
  me=name;
  try{localStorage.setItem(NAME_KEY,name);}catch(e){}
  document.getElementById("nameGate").classList.remove("on");
  renderAll();updateHeaderMe();
}
function updateHeaderMe(){
  const el=document.getElementById("meLabel");
  if(el)el.textContent=me?`${me} 집사`:"";
  if(!SYNC_URL)setSync(false,"이 기기에 저장");
}
function openNameGate(force){
  const g=document.getElementById("nameGate");
  let h=`<div class="gate-box">
    <div class="gate-leaf">🌿</div>
    <div class="gate-title">어느 집사님이신가요?</div>
    <div class="gate-sub">한 번 고르면 이 기기에서 기억해요.<br>정리·할 일·사랑방에 이름이 자동으로 들어갑니다.</div>
    <div class="gate-names">${CARETAKERS.map(n=>`<button onclick="setMe('${n}')">${n}</button>`).join("")}</div>
    <button class="gate-skip" onclick="setMe('')">${force?"나중에 고를게요":"이름 없이 둘러보기"}</button>
    ${force?`<button class="gate-skip" style="margin-top:6px;font-size:11.5px;opacity:.65" onclick="resetLocalCache()">기록이 안 보이나요? 이 기기 임시저장 비우기</button>`:""}
  </div>`;
  g.innerHTML=h;g.classList.add("on");
}
function changeMe(){openNameGate(true);}
function resetLocalCache(){
  if(!confirm("이 기기에 저장된 임시 데이터를 비우고, 구글시트에서 처음부터 다시 받아올까요?\n\n서버 기록은 그대로예요. 아직 '정리 마치기'를 안 한 진행 중인 정리가 있다면 사라질 수 있어요."))return;
  try{
    localStorage.removeItem(CACHE_KEY);
    localStorage.removeItem("gbj_notify_known");
    localStorage.removeItem("gbj_notify_baseline_done");
  }catch(e){}
  location.reload();
}

document.querySelectorAll("nav button").forEach(b=>{
  b.addEventListener("click",()=>{goTab(b.dataset.tab);});
});

loadMe();
loadCache(); // 폰에 저장해둔 마지막 상태를 먼저 보여줌 — "초기화됐다 다시 뜨는" 느낌 없애기
renderAll();
restoreTabOnLoad(); // 브라우저 새로고침 시에도 보고 있던 탭으로 복귀
updateHeaderMe();
if(!me)openNameGate(false);
if(SYNC_URL){ syncPullAll(); startPolling(); } // 초기 1회는 실패시 알려줌, 이후 주기적 폴링만 조용히
</script>
